name: PostgreSQL Restore

on:
  workflow_dispatch:
    inputs:
      backup_key:
        description: "Object key under the backup bucket, e.g. wellbot/postgres/wellbot-postgres-2026-10-07T03-17-00Z.dump"
        required: true
        type: string
      confirm:
        description: "Type RESTORE to confirm replacing the current database"
        required: true
        type: string

jobs:
  restore:
    if: ${{ inputs.confirm == 'RESTORE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL S3_ENDPOINT S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download selected backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore
          aws s3 cp "s3://$S3_BUCKET/${{ inputs.backup_key }}" restore/database.dump --endpoint-url "$S3_ENDPOINT" --only-show-errors
          aws s3 cp "s3://$S3_BUCKET/${{ inputs.backup_key }}.sha256" restore/database.dump.sha256 --endpoint-url "$S3_ENDPOINT" --only-show-errors
          cd restore
          expected="$(awk '{print $1}' database.dump.sha256)"
          actual="$(sha256sum database.dump | awk '{print $1}')"
          test "$expected" = "$actual"

      - name: Restore database
        shell: bash
        run: |
          set -euo pipefail
          pg_restore --clean --if-exists --no-owner --no-privileges --dbname="$DATABASE_URL" restore/database.dump

      - name: Verify database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT current_database(), current_setting('server_version');"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.users'), to_regclass('public.ads'), to_regclass('public.links');"
