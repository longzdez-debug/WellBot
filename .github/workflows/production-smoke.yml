name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production base URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public endpoints
        shell: bash
        env:
          PROD_URL: ${{ inputs.production_url }}
        run: |
          set -euo pipefail
          base="${PROD_URL%/}"
          curl --fail --silent --show-error --max-time 15 "$base/healthz" | tee /tmp/healthz.json
          curl --fail --silent --show-error --max-time 15 "$base/health" | tee /tmp/health.json
          curl --fail --silent --show-error --max-time 15 "$base/terms" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$base/metrics" >/tmp/metrics.txt
          grep -q '^wellbot_scheduler_running 1$' /tmp/metrics.txt
          grep -q '^wellbot_notifications_pending ' /tmp/metrics.txt
