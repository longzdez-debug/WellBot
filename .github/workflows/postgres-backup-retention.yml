name: PostgreSQL Backup Retention

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"

permissions:
  contents: read

concurrency:
  group: wellbot-postgres-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
      RETENTION_DAYS: 35
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          for name in S3_ENDPOINT S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Delete backups older than retention window
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "-${RETENTION_DAYS} days" +%s)"
          export CUTOFF_TS="$cutoff"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix wellbot/postgres/ --endpoint-url "$S3_ENDPOINT" --output json > /tmp/objects.json
          python3 - <<'PY'
          import json, os, subprocess, datetime
          data=json.load(open('/tmp/objects.json'))
          cutoff=int(os.environ.get('CUTOFF_TS') or (int(datetime.datetime.now(datetime.timezone.utc).timestamp())-35*86400))
          for obj in data.get('Contents',[]):
              key=obj['Key']
              if not key.endswith(('.dump','.dump.sha256')): continue
              ts=int(datetime.datetime.fromisoformat(obj['LastModified'].replace('Z','+00:00')).timestamp())
              if ts < cutoff:
                  subprocess.run(['aws','s3','rm',f"s3://{os.environ['S3_BUCKET']}/{key}",'--endpoint-url',os.environ['S3_ENDPOINT'],'--only-show-errors'],check=True)
          PY

