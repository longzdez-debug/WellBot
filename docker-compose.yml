services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wellbot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d wellbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      DATABASE_URL: postgresql://bot_user:${DB_PASSWORD}@postgres:5432/wellbot
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      YANDEX_STATIC_MAPS_API_KEY: ${YANDEX_STATIC_MAPS_API_KEY:-}
      HUNT_WEBAPP_URL: ${HUNT_WEBAPP_URL:-}
      HUNT_WEB_PORT: ${HUNT_WEB_PORT:-8080}
      PARSE_INTERVAL_SECONDS: ${PARSE_INTERVAL_SECONDS:-5}
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-5}
      PARSE_TIMEOUT_MS: ${PARSE_TIMEOUT_MS:-9000}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-25}
      NOTIFICATION_DRAIN_MS: ${NOTIFICATION_DRAIN_MS:-1000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-12}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-14}
      NODE_ENV: production
    ports:
      - "${HUNT_WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
