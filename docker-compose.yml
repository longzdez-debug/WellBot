services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wellbot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d wellbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql://bot_user:${DB_PASSWORD:-secure_password}@postgres:5432/wellbot
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      YANDEX_STATIC_MAPS_API_KEY: ${YANDEX_STATIC_MAPS_API_KEY:-}
      HUNT_WEBAPP_URL: ${HUNT_WEBAPP_URL:-}
      HUNT_WEB_PORT: 8080
      PARSE_INTERVAL_SECONDS: ${PARSE_INTERVAL_SECONDS:-5}
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-20}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-12}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-14}
      NODE_ENV: production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
