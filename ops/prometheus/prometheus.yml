global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/wellbot-alerts.yml

scrape_configs:
  - job_name: wellbot
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ['wellbot.example.com']
        labels:
          service: wellbot
          environment: production
